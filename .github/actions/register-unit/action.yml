# Registra en el catálogo de Port la unidad recién sembrada.
#
# CON ESTE PASO LA UNIDAD PASA A EXISTIR. Hasta aquí había una rama; a partir de aquí hay una unidad
# en estado Desarrollo, que el modelo define como «hay ficha y ningún release».
#
# LA FICHA SE CREA, NO SE ACTUALIZA. Medido el 25 de septiembre de 2026: un POST sin `upsert` sobre
# un identificador existente devuelve 409 `identifier_taken`. La operación de actualización de Port
# es una reescritura silenciosa, y aquí convertiría un choque de nombres en el borrado de la ficha
# ajena sin un solo error.
#
# DISTINGUE DOS DESENLACES que no son lo mismo: el nombre ya tomado es una RESPUESTA, y sale por
# `name-taken`; no poder hablar con el catálogo es una avería, y falla el paso.
name: register-unit
description: Crea la ficha de la unidad en el catálogo de Port, en estado Desarrollo.

inputs:
  payload-file:
    description: Archivo JSON con el formulario ya normalizado.
    required: true
  sha:
    description: Commit de la rama sembrada.
    required: true
  branch:
    description: Rama donde quedó el esqueleto. Se nombra en el resumen que lee el autor.
    required: false
    default: ""
  run-id:
    description: Ejecución de Port a la que devolver el resultado.
    required: false
    default: ""

outputs:
  name-taken:
    description: "true si el nombre ya tenía ficha; false en cualquier otro caso."
    value: ${{ steps.register.outputs.name_taken }}
  reason:
    description: El motivo legible cuando el nombre ya estaba tomado.
    value: ${{ steps.register.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Instalar la versión de Python que el estándar declara
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version

    - name: Instalar las herramientas desde el árbol del estándar que trae esta action
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet "${{ github.action_path }}/../../.."

    - name: Crear la ficha en el catálogo
      id: register
      shell: bash
      env:
        PAYLOAD_FILE: ${{ inputs.payload-file }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        RUN_ID: ${{ inputs.run-id }}
        STANDARD_TREE: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        set +e
        REASON="$(python "$STANDARD_TREE/tools/register_unit.py" \
          --payload "$PAYLOAD_FILE" --sha "$SHA" --branch "$BRANCH" --run-id "$RUN_ID")"
        status=$?
        set -e
        # El código 3 es «el nombre ya tiene ficha», que no es una avería: se propaga como dato para
        # que quien invoca lo convierta en el motivo que devuelve a la persona.
        if [ "$status" = "3" ]; then
          echo "name_taken=true" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$REASON" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "name_taken=false" >> "$GITHUB_OUTPUT"
        echo "reason=" >> "$GITHUB_OUTPUT"
        exit "$status"
