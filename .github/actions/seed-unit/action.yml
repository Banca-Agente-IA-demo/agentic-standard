# Siembra el esqueleto de una unidad a partir del formulario de autoservicio de Port.
#
# ES UNA COMPOSITE ACTION Y NO UN PASO DEL REUTILIZABLE POR EL MISMO MOTIVO MEDIDO QUE `validate`: un
# reutilizable NO puede leer archivos de su propio repositorio, y la credencial por defecto de un
# workflow está acotada al repositorio del llamador, así que no puede clonar el estándar cuando es
# privado, que es el caso de BCP. Una composite action se resuelve por la política de acceso de la
# organización y llega con el árbol del estándar dentro, de modo que el sembrador y LAS PLANTILLAS
# salen de ese mismo árbol. Nadie teclea una versión, y la de las plantillas no puede separarse de la
# del workflow que las usa.
#
# Por lo mismo, la versión de Python sale de `.python-version` del estándar y no de un valor escrito
# aquí: un solo sitio donde cambiar el número.
name: seed-unit
description: Siembra el esqueleto de una unidad publicable desde las plantillas del estándar.

inputs:
  payload-file:
    description: Archivo JSON con el formulario que envió Port.
    required: true
  root:
    description: Raíz del repositorio de dominio donde se siembra la unidad.
    required: false
    default: "."

outputs:
  files:
    description: JSON con las rutas sembradas, relativas a la raíz del repositorio de dominio.
    value: ${{ steps.seed.outputs.files }}

runs:
  using: composite
  steps:
    - name: Instalar la versión de Python que el estándar declara
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version

    - name: Instalar el sembrador desde el árbol del estándar que trae esta action
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet "${{ github.action_path }}/../../.."

    - name: Sembrar la unidad desde las plantillas del estándar
      id: seed
      shell: bash
      env:
        PAYLOAD_FILE: ${{ inputs.payload-file }}
        ROOT: ${{ inputs.root }}
        STANDARD_TREE: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        # La lista de archivos sale por stdout y el diagnóstico por stderr: las dos corrientes no se
        # mezclan, así que el JSON llega limpio al output aunque el sembrador informe de cada paso.
        FILES="$(python "$STANDARD_TREE/tools/seed_unit.py" \
          --payload "$PAYLOAD_FILE" \
          --templates "$STANDARD_TREE/templates" \
          --root "$ROOT")"
        echo "files=$FILES" >> "$GITHUB_OUTPUT"
        {
          echo "### Esqueleto sembrado"
          echo ''
          echo "$FILES" | python -c 'import json,sys; [print("- `%s`" % f) for f in json.load(sys.stdin)]'
        } >> "$GITHUB_STEP_SUMMARY"
