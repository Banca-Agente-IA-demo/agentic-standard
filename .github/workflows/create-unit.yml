# Creación: siembra el esqueleto de una unidad nueva en su rama de trabajo, desde el formulario de
# autoservicio de Port.
#
# Es el flujo 0, anterior al registro. Escribe en el repositorio del dominio y habla con el catálogo,
# así que a diferencia de `register` necesita permiso de escritura y las credenciales de Port.
#
# FIRMA PARA QUIEN LO INVOCA:
#
#   permiso            por qué
#   contents: write    crear la rama feat/<unidad> y empujar el esqueleto
#
#   secreto                por qué
#   PORT_CLIENT_ID         consultar el catálogo, devolver el motivo y registrar la ficha
#   PORT_CLIENT_SECRET     idem
#
# El llamador debe conceder exactamente eso. Los permisos del llamado solo se pueden mantener o
# reducir, nunca elevar: si concede menos, la ejecución muere en el arranque sin mensaje útil.
#
# UN SOLO JOB, como el diagrama de autoría. La consecuencia hay que conocerla: en Actions el token se
# concede POR JOB y todos los steps lo comparten, así que el step que procesa el formulario corre con
# el mismo `contents: write` que necesita el push. No aumenta el permiso máximo; aumenta cuánto
# código queda expuesto a él. Lo mitiga que el step de Python no toca el repositorio: quien hace
# `git` son los dos steps de shell.
#
# TODO LO QUE DECIDE ESTÁ EN UN SOLO STEP DE PYTHON. Las cajas del recuadro `create unit step` del
# diagrama (validar el formulario, pedir el catálogo en todos los estados, comprobar que el nombre
# esté libre, sembrar el esqueleto y devolver el motivo cuando no procede) son las cuatro bandas de
# `tools/create_unit/`. Este archivo solo dice EN QUÉ ORDEN ocurren las cosas (E3).
#
# EL CÓDIGO Y LAS PLANTILLAS NO SE CLONAN: llegan dentro de la composite action. Medido en la ronda
# 29 de `experimentos`: un reutilizable no puede leer archivos de su propio repositorio, y
# `checkout` del estándar privado falla con `Repository not found`, mientras que una composite action
# llega con su árbol.
#
# LA RAMA SE CREA ANTES DE VALIDAR, como en el diagrama, y no es un descuido: es una rama LOCAL del
# runner. Solo se empuja cuando el veredicto es `valid`, así que un formulario inválido no deja nada
# en el remoto.
name: create-unit

on:
  workflow_call:
    inputs:
      payload:
        description: JSON con el formulario que envió Port.
        required: true
        type: string
      port_run_id:
        description: Identificador de la ejecución en Port, para devolverle el estado.
        required: false
        type: string
        default: ""
    secrets:
      PORT_CLIENT_ID:
        required: true
      PORT_CLIENT_SECRET:
        required: true
    outputs:
      unit-name:
        description: El nombre de la unidad sembrada.
        value: ${{ jobs.create-unit.outputs.unit-name }}
      validation-status:
        description: "Uno de: valid, malformed_payload, name_taken."
        value: ${{ jobs.create-unit.outputs.validation-status }}
      branch:
        description: La rama donde quedó el esqueleto.
        value: ${{ jobs.create-unit.outputs.branch }}
permissions: {}

jobs:
  create-unit:
    name: create-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Las credenciales van al nivel del JOB y no al del step. Un `env:` sobre un step que invoca una
    # composite action no está garantizado que llegue a los pasos de dentro; el del job sí, y es
    # donde de verdad hacen falta.
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      # El nombre de la unidad se resuelve UNA vez, del formulario, y viaja como variable del job.
      # La misma expresión repetida en cuatro steps son cuatro sitios donde puede divergir (Y3).
      UNIT_NAME: ${{ fromJSON(inputs.payload).name }}
    outputs:
      validation-status: ${{ steps.create.outputs.validation-status }}
      unit-name: ${{ steps.create.outputs.unit-name }}
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - name: Checkout del repositorio de dominio, donde vivirá la unidad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolver el nombre de la rama de trabajo
        id: branch
        run: echo "name=feat/$UNIT_NAME" >> "$GITHUB_OUTPUT"

      - name: Crear la rama de trabajo de la unidad
        # Falla si la rama ya existe, y fallar es lo correcto: enviar el formulario dos veces para la
        # misma unidad debe fallar en voz alta y nunca sobrescribir.
        run: git switch -c "${{ steps.branch.outputs.name }}"

      - name: Guardar el formulario de Port en un archivo
        # El payload va a un archivo y no a la línea de órdenes: un JSON con comillas y saltos de
        # línea no se escapa igual en cada shell, y un escapado que falla no da error, da OTRO JSON.
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"

      - name: Validar el formulario, comprobar el nombre y sembrar el esqueleto
        id: create
        # Las actions de este repositorio apuntan a la RAMA mientras se prueba, porque la etiqueta
        # `v1` existe desde antes y no las contiene. Vuelven a `@v1` al fusionar.
        uses: Banca-Agente-IA-demo/agentic-standard/.github/actions/create-unit@feat/create-unit-self-service
        with:
          payload-file: ${{ runner.temp }}/payload.json
          root: ${{ github.workspace }}
          run-id: ${{ inputs.port_run_id }}

      - name: Publicar la rama con el esqueleto
        if: steps.create.outputs.validation-status == 'valid'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat($UNIT_NAME): esqueleto sembrado desde el autoservicio de Port"
          git push --set-upstream origin "$BRANCH"

      - name: Anotar el commit sembrado
        # Es la clave de cruce entre el catálogo y el repositorio, y se resuelve DESPUÉS del push,
        # que es cuando ese commit existe en el remoto.
        id: commit
        if: steps.create.outputs.validation-status == 'valid'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guardar el formulario normalizado en un archivo
        if: steps.create.outputs.validation-status == 'valid'
        env:
          NORMALIZED: ${{ steps.create.outputs.normalized-payload }}
        run: printf '%s' "$NORMALIZED" > "$RUNNER_TEMP/normalized.json"

      - name: Registrar la unidad en el catálogo, en estado Desarrollo
        id: register
        if: steps.create.outputs.validation-status == 'valid'
        uses: Banca-Agente-IA-demo/agentic-standard/.github/actions/register-unit@feat/create-unit-self-service
        with:
          payload-file: ${{ runner.temp }}/normalized.json
          sha: ${{ steps.commit.outputs.sha }}
          branch: ${{ steps.branch.outputs.name }}
          run-id: ${{ inputs.port_run_id }}

      - name: Retirar la rama si el nombre ya tenía ficha
        # Es el único caso en que la rama sobra y el fallo no es nuestro: dos autores fueron con el
        # mismo nombre y este llegó segundo. La comprobación previa estrecha esa ventana pero no la
        # cierra, porque la ficha nace al final. El motivo ya se devolvió a Port desde el registro.
        if: steps.register.outputs.name-taken == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin --delete "$BRANCH"

      - name: Retirar la rama si algo falló después de publicarla
        # O existen la rama y la ficha, o no existe ninguna de las dos. Una rama sin ficha es
        # indistinguible de una unidad abandonada, y una ficha sin rama promete un código que no
        # está. El `|| true` cubre el caso de que la rama nunca llegara a empujarse.
        if: failure()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin --delete "$BRANCH" || true
