[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-standard-tools"
version = "0.1.0"
description = "Herramientas del equipo de plataforma del estándar agéntico (no se distribuyen)"
# 3.11 es el suelo declarado por la constitución hasta medir el Python de BCP (hito A0).
requires-python = ">=3.11"
# pydantic lo exige C2 para la frontera exterior: el payload del formulario de Port entra al sistema
# de tipos desde fuera, y `model_validate()` falla en el sitio y con el nombre del campo en vez de
# tres funciones más tarde. Es dependencia de EJECUCIÓN porque el sembrador corre en el runner.
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# jsonschema valida los contratos de schemas/ en las pruebas. Es dependencia de DESARROLLO: los
# esquemas son datos y el paquete del validador declarará la suya de ejecución en std-003.
dev = ["pytest>=8", "jsonschema>=4.20", "pyyaml>=6", "hatchling>=1.21"]

[project.scripts]
smoke-org = "smoke_org.__main__:main"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
smoke_org = ["environments/*.json"]

[tool.pytest.ini_options]
# El plugin del asistente trae sus propias pruebas y viajan con la unidad, como exige el estándar.
testpaths = ["tests", "plugins/authoring-assistant/tests"]
markers = ["slow: construye la distribución del validador; tarda unos segundos"]
