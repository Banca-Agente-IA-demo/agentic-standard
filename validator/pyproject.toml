[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentic-validator"
version = "0.1.0"
description = "Reglas del estándar agéntico sobre una unidad publicable"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "pyyaml>=6", "referencing>=0.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rules = "agentic_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentic_validator"]

# D5: el contrato de gobierno existe en un único sitio, schemas/ del repositorio, y viaja como dato
# dentro del paquete. Se inyecta al construir para que no haya una segunda copia en el árbol.
[tool.hatch.build.targets.wheel.force-include]
"../schemas/governance.schema.json" = "agentic_validator/schemas/governance.schema.json"
